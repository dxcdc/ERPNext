name: Auto Merge Pull Requests

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Aprovar e Unificar Pull Request (Auto-Merge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Processar Aprovação e Mesclagem Automática
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -e
          echo "=================================================="
          echo "Processando Auto-Merge para o Pull Request: $PR_URL"
          echo "=================================================="

          # 1. Aprovação automática do PR via GitHub CLI
          gh pr review "$PR_URL" --approve --body "Aprovado automaticamente via GitHub Actions CI/CD CDC Standard."

          # 2. Mesclagem automática (merge) e exclusão da branch de origem
          gh pr merge "$PR_URL" --merge --delete-branch

          echo "=> Pull Request aprovado, mesclado e branch removida com sucesso!"
