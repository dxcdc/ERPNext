name: Automatizar Criação de GitHub Issues

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    name: Criar Issues de Governança e Infraestrutura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Processar e Criar Issues no Repositório
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          ensure_labels_exist() {
            local labels="$1"
            IFS=',' read -ra LABEL_ARRAY <<< "$labels"
            for label in "${LABEL_ARRAY[@]}"; do
              label=$(echo "$label" | xargs)
              if [ -n "$label" ]; then
                gh label create "$label" --force --color "0E8A16" --description "Label corporativa CDC" 2>/dev/null || true
              fi
            done
          }

          create_issue_if_not_exists() {
            local search_term="$1"
            local title="$2"
            local body="$3"
            local labels="$4"

            echo "--------------------------------------------------"
            echo "Verificando se a issue '$title' já existe..."
            existing=$(gh issue list --search "$search_term" --json title --jq '.[] | .title' | head -n 1)

            if [ -n "$existing" ]; then
              echo "=> Issue encontrada: '$existing'. Pulando criação para evitar duplicidade."
            else
              echo "=> Criando labels no repositório se não existirem: '$labels'..."
              ensure_labels_exist "$labels"

              echo "=> Criando nova Issue no GitHub: '$title'..."
              gh issue create --title "$title" --body "$body" --label "$labels"
              echo "=> Issue criada com sucesso!"
            fi
          }

          # Issue 1: Conteinerização do Extrator
          BODY1=$(cat << 'EOF'
          ### 📌 Descrição Técnica
          Empacotar o pipeline do extrator de dados (`run_job.sh`) e seus scripts Python em uma imagem Docker dedicada integrada à rede do Compose (`frappe_network`), isolando o consumo de recursos do host.

          ### 📋 Critérios de Aceite
          - [ ] Criar `Dockerfile` otimizado para o serviço `cdc-extractor`.
          - [ ] Definir limites estritos de recursos no `docker-compose.yml` (`cpus: 0.5`, `memory: 512m`).
          - [ ] Substituir o cron do host por um agendador conteinerizado interno.

          ### 🔗 Documentos de Referência
          - [docs/issues_planejamento.md](https://github.com/${{ github.repository }}/blob/main/docs/issues_planejamento.md)
          - [docs/relatorio_fase3_laboratorio.md](https://github.com/${{ github.repository }}/blob/main/docs/relatorio_fase3_laboratorio.md)
          EOF
          )
          create_issue_if_not_exists \
            "Conteinerização Completa e Isolamento" \
            "[ARCH] Conteinerização Completa e Isolamento de Recursos do Extrator" \
            "$BODY1" \
            "enhancement,docker,architecture"

          # Issue 2: Otimização de Performance
          BODY2=$(cat << 'EOF'
          ### 📌 Descrição Técnica
          Refatorar o script `4_Extrator_produtos_v2.py` para substituir iterações individuais por requisições em lote (*bulk update / batching*) no ERPNext, reduzindo o tempo de execução de 4 minutos para menos de 30 segundos.

          ### 📋 Critérios de Aceite
          - [ ] Implementar chamadas em lote nas requisições da API do ERPNext.
          - [ ] Reduzir o tempo total de execução para menos de 30 segundos.
          - [ ] Adicionar logs estruturados de tempo de resposta por lote.

          ### 🔗 Documentos de Referência
          - [docs/issues_planejamento.md](https://github.com/${{ github.repository }}/blob/main/docs/issues_planejamento.md)
          EOF
          )
          create_issue_if_not_exists \
            "Otimização de Performance do Script de Produtos" \
            "[FEAT] Otimização de Performance do Script de Produtos (Bulk Update)" \
            "$BODY2" \
            "performance,python,refactor"

          # Issue 3: Migração Rclone
          BODY3=$(cat << 'EOF'
          ### 📌 Descrição Técnica
          Substituir o script legado em Python (`bkp.py`) pelo utilitário profissional de linha de comando **Rclone**, utilizando as credenciais verificadas do projeto GCP `cdc-org` no Google Drive da CDC.

          ### 📋 Critérios de Aceite
          - [ ] Configurar o Rclone na Hostinger VPS integrado ao Google Drive institucional da CDC.
          - [ ] Implementar verificação atômica por hash MD5/SHA256 após o upload.
          - [ ] Garantir renovação automática de tokens OAuth sem intervenção humana.

          ### 🔗 Documentos de Referência
          - [docs/estrategia_backup_gdrive.md](https://github.com/${{ github.repository }}/blob/main/docs/estrategia_backup_gdrive.md)
          - [docs/politica_backup.md](https://github.com/${{ github.repository }}/blob/main/docs/politica_backup.md)
          EOF
          )
          create_issue_if_not_exists \
            "Migração do Motor de Backups para Rclone" \
            "[CONFIG] Migração do Motor de Backups para Rclone & CDC Backups Hub" \
            "$BODY3" \
            "backups,rclone,devops"

          # Issue 4: Alertas Mattermost
          BODY4=$(cat << 'EOF'
          ### 📌 Descrição Técnica
          Criar um mecanismo de notificação ativa que informe a equipe de TI no Mattermost sempre que o backup for concluído com sucesso ou falhar.

          ### 📋 Critérios de Aceite
          - [ ] Criar Webhook de entrada no servidor Mattermost da CDC.
          - [ ] Integrar chamada cURL silenciosa nos scripts de backup e saúde do contêiner.
          - [ ] Enviar payload formatado com status, tamanho do arquivo e tempo decorrido.

          ### 🔗 Documentos de Referência
          - [docs/issues_planejamento.md](https://github.com/${{ github.repository }}/blob/main/docs/issues_planejamento.md)
          - [docs/troubleshooting.md](https://github.com/${{ github.repository }}/blob/main/docs/troubleshooting.md)
          EOF
          )
          create_issue_if_not_exists \
            "Implantação do Canal de Alertas e Notificações no Mattermost" \
            "[FEAT] Implantação do Canal de Alertas e Notificações no Mattermost" \
            "$BODY4" \
            "monitoring,mattermost,integrations"

          # Issue 5: Hardening de Senhas e GPG
          BODY5=$(cat << 'EOF'
          ### 📌 Descrição Técnica
          Eliminar senhas em texto claro (`admin`) dos arquivos de configuração e implementar criptografia assimétrica GPG nos backups offsite antes do envio ao Google Drive.

          ### 📋 Critérios de Aceite
          - [ ] Mapear senhas do MariaDB para variáveis de ambiente criptografadas no arquivo `.env`.
          - [ ] Implementar chave assimétrica GPG para criptografar os dumps `.sql.gz` e arquivos `.tar` antes do upload.
          - [ ] Documentar o procedimento de decodificação de emergência com a chave privada.

          ### 🔗 Documentos de Referência
          - [docs/migration_guide.md](https://github.com/${{ github.repository }}/blob/main/docs/migration_guide.md)
          - [docs/politica_backup.md](https://github.com/${{ github.repository }}/blob/main/docs/politica_backup.md)
          EOF
          )
          create_issue_if_not_exists \
            "Hardening de Senhas em Texto Puro" \
            "[SECURITY] Hardening de Senhas em Texto Puro e Criptografia GPG nos Backups" \
            "$BODY5" \
            "security,hardening,gpg"

          # Issue 6: Multi-Tenant Sandbox
          BODY6=$(cat << 'EOF'
          ### 📌 Descrição Técnica
          Configurar um segundo site no Frappe/ERPNext (`treinamento.cdc.org.br`) na mesma VPS Hostinger para permitir que gestores e operadores realizem testes e treinamentos isolados da produção.

          ### 📋 Critérios de Aceite
          - [ ] Executar o comando `bench new-site treinamento.cdc.org.br` na VPS.
          - [ ] Configurar rotina mensal automatizada para clonar o banco de produção para a base de treinamento.
          - [ ] Aplicar tema customizado no painel para diferenciar o ambiente de testes do oficial.

          ### 🔗 Documentos de Referência
          - [docs/issues_planejamento.md](https://github.com/${{ github.repository }}/blob/main/docs/issues_planejamento.md)
          EOF
          )
          create_issue_if_not_exists \
            "Configuração do Ambiente Multi-Tenant de Treinamento" \
            "[FEAT] Configuração do Ambiente Multi-Tenant de Treinamento (Sandbox)" \
            "$BODY6" \
            "feature,multi-tenant,sandbox"
