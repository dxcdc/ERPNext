  - nexterp-frontend-1
  - nexterp-websocket-1
  - nexterp-queue-short-1
  - nexterp-queue-long-1
  - nexterp-scheduler-1
cdc_containers:
  - nexterp-backend-1
  - nexterp-frontend-1
  - nexterp-websocket-1
  - nexterp-queue-short-1
  - nexterp-queue-long-1
  - nexterp-scheduler-1
  - nexterp-db-1
  - nexterp-redis-cache-1
