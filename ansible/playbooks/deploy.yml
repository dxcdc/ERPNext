---
- name: Publicar uma revisao exata do CDC NextERP
  hosts: cdc_production
  gather_facts: true
  become: false
  serial: 1
  vars:
    cdc_deploy_requested: true
  pre_tasks:
    - name: Exigir a revisao que sera publicada
      ansible.builtin.assert:
        that:
          - release_commit is defined
          - release_commit is match('^[0-9a-f]{40}$')
        fail_msg: Use -e release_commit=<SHA completo de 40 caracteres>.
      tags: [always]
  tasks:
    - name: Adquirir bloqueio exclusivo de operacao
      ansible.builtin.command:
        argv: [mkdir, "{{ cdc_deploy_lock }}"]
      register: deploy_lock_result
      changed_when: deploy_lock_result.rc == 0
      failed_when: false

    - name: Recusar outra operacao mutavel em andamento
      ansible.builtin.assert:
        that: deploy_lock_result.rc == 0
        fail_msg: Outra operacao de backup, deploy ou rollback ja esta em andamento.

    - name: Executar deploy protegido pelo bloqueio
      block:
        - name: Executar verificacoes anteriores
          ansible.builtin.include_role:
            name: preflight

        - name: Criar backup anterior ao deploy
          ansible.builtin.include_role:
            name: backup

        - name: Publicar a revisao autorizada
          ansible.builtin.include_role:
            name: deploy

        - name: Validar a publicacao
          ansible.builtin.include_role:
            name: validate
      always:
        - name: Liberar bloqueio exclusivo de operacao
          ansible.builtin.file:
            path: "{{ cdc_deploy_lock }}"
            state: absent
